name: Code Quality

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    name: Python Formatting, Linting, Types, and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Repository Toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          python-cache: pip
          python-cache-dependency-path: pyproject.toml

      - name: Run Python Checks
        run: python -m orchestrator ci python

  backend-formatting:
    name: Backend Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Repository Toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          setup-dotnet: "true"
          dotnet-cache: "true"
          dotnet-cache-dependency-path: |
            backend/**/*.csproj
            backend/Directory.Build.props
            backend/Directory.Packages.props
            .config/dotnet-tools.json

      - name: Format Backend
        run: python -m orchestrator ci backend-format

  frontend-quality:
    name: Frontend Formatting and Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Repository Toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          setup-node: "true"
          node-cache: npm
          node-cache-dependency-path: frontend/package-lock.json

      - name: Format and Lint Frontend
        run: python -m orchestrator ci frontend-format

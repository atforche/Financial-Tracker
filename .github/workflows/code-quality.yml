name: Code Quality

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    name: Python Formatting, Linting, Types, and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Run Python Checks
        run: python scripts/pipeline_script.py python

  backend-formatting:
    name: Backend Formatting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./scripts

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x.x
          cache: true
          cache-dependency-path: |
            backend/**/*.csproj
            backend/Directory.Build.props

      - name: Format Backend
        run: python pipeline_script.py backend-format

  frontend-quality:
    name: Frontend Formatting and Linting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./scripts

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.5.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Format and Lint Frontend
        run: python pipeline_script.py frontend-format

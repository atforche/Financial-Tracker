name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full commit SHA published by the release workflow
        required: true
        type: string
      release_run_id:
        description: Run ID of the successful release workflow
        required: true
        type: string

permissions:
  contents: read
  actions: read
  packages: read

concurrency:
  group: production-operations
  cancel-in-progress: false

jobs:
  validate-request:
    name: Validate Deployment Request
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Repository Toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Validate Workflow Inputs
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Production deployments must be dispatched from main." >&2
            exit 1
          fi
          if [[ ! "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release_sha must be a full lowercase commit SHA." >&2
            exit 1
          fi
          if [[ ! "${RELEASE_RUN_ID}" =~ ^[0-9]+$ ]]; then
            echo "release_run_id must be numeric." >&2
            exit 1
          fi

      - name: Validate Release Workflow Run
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m orchestrator release validate-run \
            --commit "${{ inputs.release_sha }}" \
            --run-id "${{ inputs.release_run_id }}"

  deploy-production:
    name: Deploy Production
    needs: validate-request
    runs-on: [self-hosted, linux, production]
    environment: production
    timeout-minutes: 15

    steps:
      - name: Checkout Released Revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false

      - name: Setup Repository Toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Download Release Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-${{ inputs.release_sha }}
          path: ${{ runner.temp }}/financial-tracker-release
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.release_run_id }}

      - name: Verify Release Artifact
        run: |
          python -m orchestrator release validate-artifact \
            --commit "${{ inputs.release_sha }}" \
            --manifest "${{ runner.temp }}/financial-tracker-release/release-manifest.json"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Deploy Release
        env:
          INSTANCE_PATH: ${{ vars.INSTANCE_PATH }}
          INSTANCE_NAME: ${{ vars.INSTANCE_NAME }}
          ENVIRONMENT: ${{ vars.ENVIRONMENT }}
          PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          INITIAL_ADMIN_EMAIL: ${{ vars.INITIAL_ADMIN_EMAIL }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          RELEASE_MANIFEST: ${{ runner.temp }}/financial-tracker-release/release-manifest.json
        run: |
          required_values=(INSTANCE_PATH INSTANCE_NAME PUBLIC_ORIGIN GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET AUTH_SECRET INITIAL_ADMIN_EMAIL)
          for value_name in "${required_values[@]}"; do
            if [[ -z "${!value_name}" ]]; then
              echo "The production environment value ${value_name} must be configured." >&2
              exit 1
            fi
          done
          python -m orchestrator deploy deploy \
            --path "${INSTANCE_PATH}" \
            --release-manifest "${RELEASE_MANIFEST}"

      - name: Record Deployment
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
        run: |
          {
            echo "## Production deployment"
            echo
            echo "- Commit: \`${RELEASE_SHA}\`"
            echo "- Release workflow run: \`${RELEASE_RUN_ID}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

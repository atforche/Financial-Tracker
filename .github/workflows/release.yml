name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-images:
    name: Build and Publish Container Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Repository Toolchain
        id: toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          cache-trivy: "true"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Expose GitHub Actions Runtime
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      # The pull request already smoke-tested this code, so the release only
      # rebuilds (from cache) and rescans the images it is about to publish.
      - name: Build and Scan Container Images
        env:
          DOCKER_BUILD_CACHE: gha
        run: python -m orchestrator ci container-release

      - name: Resolve Registry Image Names
        id: images
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "backend=ghcr.io/${repository}-backend" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/${repository}-frontend" >> "$GITHUB_OUTPUT"
          echo "migrator=ghcr.io/${repository}-migrator" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Backend Image
        env:
          IMAGE: ${{ steps.images.outputs.backend }}
        run: |
          docker tag "${{ steps.toolchain.outputs.backend_image }}" "${IMAGE}:sha-${GITHUB_SHA}"
          docker push "${IMAGE}:sha-${GITHUB_SHA}"

      - name: Publish Frontend Image
        env:
          IMAGE: ${{ steps.images.outputs.frontend }}
        run: |
          docker tag "${{ steps.toolchain.outputs.frontend_image }}" "${IMAGE}:sha-${GITHUB_SHA}"
          docker push "${IMAGE}:sha-${GITHUB_SHA}"

      - name: Publish Migrator Image
        env:
          IMAGE: ${{ steps.images.outputs.migrator }}
        run: |
          docker tag "${{ steps.toolchain.outputs.migrator_image }}" "${IMAGE}:sha-${GITHUB_SHA}"
          docker push "${IMAGE}:sha-${GITHUB_SHA}"

      - name: Create Release Manifest
        env:
          BACKEND_IMAGE: ${{ steps.images.outputs.backend }}
          FRONTEND_IMAGE: ${{ steps.images.outputs.frontend }}
          MIGRATOR_IMAGE: ${{ steps.images.outputs.migrator }}
        run: |
          backend_reference="$(docker image inspect --format='{{index .RepoDigests 0}}' "${BACKEND_IMAGE}:sha-${GITHUB_SHA}")"
          frontend_reference="$(docker image inspect --format='{{index .RepoDigests 0}}' "${FRONTEND_IMAGE}:sha-${GITHUB_SHA}")"
          migrator_reference="$(docker image inspect --format='{{index .RepoDigests 0}}' "${MIGRATOR_IMAGE}:sha-${GITHUB_SHA}")"
          jq --null-input \
            --arg commit "${GITHUB_SHA}" \
            --arg backendImage "${backend_reference}" \
            --arg frontendImage "${frontend_reference}" \
            --arg migratorImage "${migrator_reference}" \
            '{commit: $commit, backendImage: $backendImage, frontendImage: $frontendImage, migratorImage: $migratorImage}' \
            > release-manifest.json

      - name: Upload Release Manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ github.sha }}
          path: |
            release-manifest.json
            compose.yaml
            Caddyfile
          if-no-files-found: error
          retention-days: 90

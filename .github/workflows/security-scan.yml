name: Security Scan

on:
  schedule:
    - cron: "29 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan
  cancel-in-progress: true

jobs:
  dependency-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Repository Toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          setup-dotnet: "true"
          dotnet-cache: "true"
          dotnet-cache-dependency-path: |
            backend/**/*.csproj
            backend/Directory.Build.props
            backend/Directory.Packages.props
            .config/dotnet-tools.json
          setup-node: "true"

      - name: Scan Dependencies
        run: python -m orchestrator ci dependencies

  image-scan:
    name: Container Image Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Repository Toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          cache-trivy: "true"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Expose GitHub Actions Runtime
        uses: crazy-max/ghaction-github-runtime@3cb05d89e1f492524af3d41a1c98c83bc3025124 # v3.1.0

      - name: Build and Scan Container Images
        env:
          DOCKER_BUILD_CACHE: gha
        run: python -m orchestrator ci container-release

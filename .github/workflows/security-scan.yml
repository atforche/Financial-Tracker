name: Security Scan

on:
  schedule:
    - cron: "29 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan
  cancel-in-progress: true

jobs:
  dependency-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Repository Toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          setup-dotnet: "true"
          dotnet-cache: "true"
          dotnet-cache-dependency-path: |
            backend/**/*.csproj
            backend/Directory.Build.props
            backend/Directory.Packages.props
            .config/dotnet-tools.json
          setup-node: "true"

      - name: Scan Dependencies
        run: python -m orchestrator ci dependencies

  image-scan:
    name: Container Image Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Repository Toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          cache-trivy: "true"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Expose GitHub Actions Runtime
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      - name: Build and Scan Container Images
        env:
          DOCKER_BUILD_CACHE: gha-write
        run: python -m orchestrator ci container-release

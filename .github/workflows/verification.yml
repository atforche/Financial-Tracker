name: Verification

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-verification:
    name: Backend Build and Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./scripts

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x.x
          cache: true
          cache-dependency-path: |
            backend/**/*.csproj
            backend/Directory.Build.props

      - name: Build and Test Backend
        run: python pipeline_script.py backend-test

      - name: Upload OpenAPI Contract
        uses: actions/upload-artifact@v4
        with:
          name: openapi-contract
          path: backend/.artifacts/obj/Rest/Financial-Tracker-API.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  frontend-verification:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./scripts

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.5.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend
        run: python pipeline_script.py frontend-build

  dependency-verification:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./scripts

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x.x
          cache: true
          cache-dependency-path: |
            backend/**/*.csproj
            backend/Directory.Build.props

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.5.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Scan Dependencies
        run: python pipeline_script.py dependencies

  api-contract-verification:
    name: Generated API Contract
    needs: backend-verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./scripts

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.5.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Download OpenAPI Contract
        uses: actions/download-artifact@v4
        with:
          name: openapi-contract
          path: backend/.artifacts/obj/Rest

      - name: Verify Frontend Models
        run: python pipeline_script.py api-contract

  container-verification:
    name: Container Security and Smoke Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./scripts

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.5.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Expose GitHub Actions Runtime
        uses: crazy-max/ghaction-github-runtime@v3

      - name: Install Frontend Test Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Chromium
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.73.0

      - name: Build, Scan, and Smoke Test Container Images
        env:
          DOCKER_BUILD_CACHE: gha
        run: python pipeline_script.py container-images

      - name: Upload Playwright Failure Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

name: Verification

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-verification:
    name: Backend Build and Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Repository Toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          setup-dotnet: "true"
          dotnet-cache: "true"
          dotnet-cache-dependency-path: |
            backend/**/*.csproj
            backend/Directory.Build.props
            backend/Directory.Packages.props
            .config/dotnet-tools.json

      - name: Build and Test Backend
        run: python -m orchestrator ci backend-test

      - name: Upload OpenAPI Contract
        uses: actions/upload-artifact@v4
        with:
          name: openapi-contract
          path: backend/.artifacts/obj/Rest/Financial-Tracker-API.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  frontend-verification:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Repository Toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          setup-node: "true"
          node-cache: npm
          node-cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend
        run: python -m orchestrator ci frontend-build

  dependency-verification:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Repository Toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          setup-dotnet: "true"
          dotnet-cache: "true"
          dotnet-cache-dependency-path: |
            backend/**/*.csproj
            backend/Directory.Build.props
            backend/Directory.Packages.props
            .config/dotnet-tools.json
          setup-node: "true"
          node-cache: npm
          node-cache-dependency-path: frontend/package-lock.json

      - name: Scan Dependencies
        run: python -m orchestrator ci dependencies

  api-contract-verification:
    name: Generated API Contract
    needs: backend-verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Repository Toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          setup-node: "true"
          node-cache: npm
          node-cache-dependency-path: frontend/package-lock.json

      - name: Download OpenAPI Contract
        uses: actions/download-artifact@v4
        with:
          name: openapi-contract
          path: backend/.artifacts/obj/Rest

      - name: Verify Frontend Models
        run: python -m orchestrator ci api-contract

  container-verification:
    name: Container Security and Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Repository Toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          setup-node: "true"
          node-cache: npm
          node-cache-dependency-path: frontend/package-lock.json

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Expose GitHub Actions Runtime
        uses: crazy-max/ghaction-github-runtime@v3

      - name: Build, Scan, and Smoke Test Container Images
        env:
          DOCKER_BUILD_CACHE: gha
        run: python -m orchestrator ci container-images

      - name: Upload Playwright Failure Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

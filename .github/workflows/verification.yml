name: Verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.filter.outputs.python }}
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      dependencies: ${{ steps.filter.outputs.dependencies }}
      containers: ${{ steps.filter.outputs.containers }}
      images: ${{ steps.filter.outputs.images }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Filter Changed Paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            shared: &shared
              - ".github/**"
              - "orchestrator/**"
              - "pyproject.toml"
              - "config/toolchain.toml"
            python:
              - *shared
              - "config/**"
            backend:
              - *shared
              - "backend/**"
              - "global.json"
              - ".config/dotnet-tools.json"
              - "frontend/framework/data/api.ts"
            frontend:
              - *shared
              - "frontend/**"
            dependencies:
              - *shared
              - "frontend/package.json"
              - "frontend/package-lock.json"
              - "backend/**/*.csproj"
              - "backend/Directory.Packages.props"
            containers:
              - *shared
              - "backend/**"
              - "frontend/**"
            images:
              - *shared
              - "backend/Dockerfile"
              - "backend/.dockerignore"
              - "backend/**/*.csproj"
              - "backend/Directory.Packages.props"
              - "frontend/Dockerfile"
              - "frontend/.dockerignore"
              - "frontend/package.json"
              - "frontend/package-lock.json"

  python-quality:
    name: Python Formatting, Linting, Types, and Tests
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Repository Toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          python-cache: pip
          python-cache-dependency-path: pyproject.toml

      - name: Run Python Checks
        run: python -m orchestrator ci python

  backend-verification:
    name: Backend Formatting, Build, Tests, and API Contract
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Repository Toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          setup-dotnet: "true"
          dotnet-cache: "true"
          dotnet-cache-dependency-path: |
            backend/**/*.csproj
            backend/Directory.Build.props
            backend/Directory.Packages.props
            .config/dotnet-tools.json
          setup-node: "true"
          node-cache: npm
          node-cache-dependency-path: frontend/package-lock.json

      - name: Format, Build, and Test Backend
        run: python -m orchestrator ci backend

      - name: Verify Frontend Models
        run: python -m orchestrator ci api-contract

  frontend-quality:
    name: Frontend Formatting, Linting, and Types
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Repository Toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          setup-node: "true"
          node-cache: npm
          node-cache-dependency-path: frontend/package-lock.json

      - name: Format, Lint, and Type-Check Frontend
        run: python -m orchestrator ci frontend

  dependency-verification:
    name: Dependency Security Scan
    needs: changes
    if: needs.changes.outputs.dependencies == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Repository Toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          setup-dotnet: "true"
          dotnet-cache: "true"
          dotnet-cache-dependency-path: |
            backend/**/*.csproj
            backend/Directory.Build.props
            backend/Directory.Packages.props
            .config/dotnet-tools.json
          setup-node: "true"

      - name: Scan Dependencies
        run: python -m orchestrator ci dependencies

  container-verification:
    name: Container Smoke Tests and Security Scan
    needs: changes
    if: needs.changes.outputs.containers == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Repository Toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          setup-node: "true"
          node-cache: npm
          node-cache-dependency-path: frontend/package-lock.json
          cache-playwright: "true"
          cache-trivy: ${{ needs.changes.outputs.images }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Expose GitHub Actions Runtime
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      - name: Build and Smoke Test Container Images
        env:
          DOCKER_BUILD_CACHE: gha
        run: python -m orchestrator ci container-images

      - name: Scan Container Images
        if: needs.changes.outputs.images == 'true'
        run: python -m orchestrator ci container-scan

      - name: Upload Playwright Failure Artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-artifacts
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

  verification-passed:
    name: Verification Passed
    if: always()
    needs:
      - changes
      - python-quality
      - backend-verification
      - frontend-quality
      - dependency-verification
      - container-verification
    runs-on: ubuntu-latest
    steps:
      - name: Check Job Results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in ${RESULTS}; do
            if [[ "${result}" != "success" && "${result}" != "skipped" ]]; then
              echo "A verification job finished with result: ${result}" >&2
              exit 1
            fi
          done

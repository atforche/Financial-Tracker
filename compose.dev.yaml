name: financial-tracker-dev

services:
  storage-init:
    image: alpine:3.23
    command: ["sh", "-c", "chown -R 1654:1654 /data /logs"]
    volumes:
      - development_data:/data
      - development_logs:/logs

  migrator:
    build:
      context: ./backend
      dockerfile: Migrator.Dockerfile
    environment:
      DATABASE_PATH: /data/database.db
      AUTH_MODE: development
      DEVELOPMENT_AUTH_SUBJECT: local-developer
      DEVELOPMENT_AUTH_ADDITIONAL_SUBJECTS: local-standard,local-read-only
      DEVELOPMENT_AUTH_READ_ONLY_SUBJECTS: local-read-only
    volumes:
      - development_data:/data
    depends_on:
      storage-init:
        condition: service_completed_successfully

  backend:
    build:
      context: ./backend
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      AUTH_MODE: development
      DEVELOPMENT_AUTH_SUBJECT: local-developer
      DEVELOPMENT_AUTH_ADDITIONAL_SUBJECTS: local-standard,local-read-only
      DEVELOPMENT_AUTH_READ_ONLY_SUBJECTS: local-read-only
      DATABASE_PATH: /data/database.db
      FRONTEND_ORIGIN: http://localhost:3001
      LOG_DIRECTORY: /logs
    volumes:
      - development_data:/data
      - development_logs:/logs
    depends_on:
      migrator:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
    env_file:
      - ./debug/.env
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      API_URL: http://backend:8080
      AUTH_MODE: development
      DEVELOPMENT_AUTH_SUBJECT: local-developer
      DEVELOPMENT_AUTH_ADDITIONAL_SUBJECTS: local-standard,local-read-only
      DEVELOPMENT_AUTH_READ_ONLY_SUBJECTS: local-read-only
      PUBLIC_ORIGIN: http://localhost:3001
      AUTH_URL: http://localhost:3001
    depends_on:
      backend:
        condition: service_healthy

volumes:
  development_data:
  development_logs:

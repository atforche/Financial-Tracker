name: "$INSTANCE_NAME"

services:
  proxy:
    image: caddy:2.11.4-alpine
    container_name: "proxy-$INSTANCE_NAME"
    ports:
      - "$PUBLIC_PORT:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    env_file: ".env"

  backend:
    image: "backend-$INSTANCE_NAME"
    container_name: "backend-$INSTANCE_NAME"
    expose:
      - "8080"
    volumes:
      - $INSTANCE_DIR/database.db:$DATABASE_PATH
      - $INSTANCE_DIR/logs:$LOG_DIRECTORY
    env_file: ".env"

  frontend:
    image: "frontend-$INSTANCE_NAME"
    container_name: "frontend-$INSTANCE_NAME"
    expose:
      - "3000"
    env_file: ".env"

volumes:
  caddy_data:
  caddy_config:

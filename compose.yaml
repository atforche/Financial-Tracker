name: "${INSTANCE_NAME:?INSTANCE_NAME must be configured}"

services:
  proxy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    container_name: "proxy-${INSTANCE_NAME}"
    ports:
      - "${PUBLIC_PORT:?PUBLIC_PORT must be configured}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      PUBLIC_HOST: "${PUBLIC_HOST:?PUBLIC_HOST must be configured}"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    read_only: true
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy

  backend:
    image: "${BACKEND_IMAGE:?BACKEND_IMAGE must be configured}"
    container_name: "backend-${INSTANCE_NAME}"
    expose:
      - "8080"
    volumes:
      - "${INSTANCE_DIR:?INSTANCE_DIR must be configured}/database.db:/data/database.db"
      - "${INSTANCE_DIR}/logs:/logs"
    environment:
      ASPNETCORE_ENVIRONMENT: "${ENVIRONMENT:?ENVIRONMENT must be configured}"
      ASPNETCORE_HTTP_PORTS: "8080"
      DATABASE_PATH: "/data/database.db"
      LOG_DIRECTORY: "/logs"
      FRONTEND_ORIGIN: "${PUBLIC_ORIGIN:?PUBLIC_ORIGIN must be configured}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID must be configured}"
      GOOGLE_ALLOWED_SUBJECTS: "${GOOGLE_ALLOWED_SUBJECTS:?GOOGLE_ALLOWED_SUBJECTS must be configured}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

  frontend:
    image: "${FRONTEND_IMAGE:?FRONTEND_IMAGE must be configured}"
    container_name: "frontend-${INSTANCE_NAME}"
    expose:
      - "3000"
    environment:
      API_URL: "http://backend:8080"
      PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:?PUBLIC_ORIGIN must be configured}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID must be configured}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET must be configured}"
      GOOGLE_ALLOWED_SUBJECTS: "${GOOGLE_ALLOWED_SUBJECTS:?GOOGLE_ALLOWED_SUBJECTS must be configured}"
      AUTH_URL: "${PUBLIC_ORIGIN}"
      AUTH_TRUST_HOST: "true"
      AUTH_SECRET: "${AUTH_SECRET:?AUTH_SECRET must be configured}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:

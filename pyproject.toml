[project]
name = "financial-tracker-orchestrator"
version = "0.1.0"
description = "Repository management orchestrator for Financial Tracker"
requires-python = ">=3.14,<3.15"
dependencies = []

[project.scripts]
ft = "orchestrator.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["orchestrator*"]

[dependency-groups]
dev = [
    "ruff==0.15.1",
    "mypy==2.3.0",
    "pytest==9.0.3",
    "pytest-cov==7.0.0",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM"]
ignore = ["UP046"]

[tool.mypy]
files = ["orchestrator"]
exclude = ["orchestrator/tests"]
python_version = "3.14"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["orchestrator/tests"]
pythonpath = ["."]
addopts = "--strict-config --strict-markers"

[tool.coverage.run]
branch = true
source = ["orchestrator"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 0
